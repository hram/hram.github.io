name: Храмов Евгений
title: null
author: Евгений Храмов
theme: just-the-docs

url: https://hram.github.io

plugins:
  - jekyll-sitemap

# язык по умолчанию — русский; английские страницы задают lang: en и locale: en_US в front matter
lang: ru
defaults:
  - scope:
      path: ""
    values:
      lang: ru
      locale: ru_RU

# исходники постановок и эталонов — не для публичной витрины
exclude:
  - prompts/
  - Gemfile
  - Gemfile.lock
  - radar/error.html # заглушка «PAGE NOT FOUND» из сборки радара — не страница сайта
  - articles/*/outline.md # рабочие черновики статей (план и исследование) — не для публикации
  - articles/*/research.md
  - articles/android-ui-renderer-mcp/article.md # сырой черновик без front matter; публикуется article-final-second-pass.md

callouts_level: quiet # or loud
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

nav_external_links:
  - title: Созвездие AI-проектов
    url: /project-galaxy.html
    hide_icon: true # внутренняя страница сайта, а не внешний ресурс
    opens_in_new_tab: false
  - title: Мой Tech Radar
    title_en: My Tech Radar # на английских страницах показываются только ссылки с title_en
    url: https://hram.github.io/radar/index.html
    hide_icon: false # set to true to hide the external link icon - defaults to false
    opens_in_new_tab: true # set to true to open this link in a new tab - defaults to false
